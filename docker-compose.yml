version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aipannel-studio-app
    restart: unless-stopped
    environment:
      - PORT=8080
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - APP_ACCESS_CODE=${APP_ACCESS_CODE:-}
    volumes:
      - ./sample_stream.mp4:/app/sample_stream.mp4:ro
      - app_data:/app/data
    networks:
      - studio_net
    expose:
      - "8080"

  gateway:
    image: nginx:alpine
    container_name: aipannel-studio-gateway
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - studio_net

networks:
  studio_net:
    driver: bridge

volumes:
  app_data:
